[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "priori-x"
version = "0.1.0"
description = "Offline-first Bayesian clinical reasoning research workbench."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sharad Patel" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "openai>=2.7.1",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "numpy>=2.1.0",
  "scipy>=1.14.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "streamlit>=1.39.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pre-commit>=3.8.0",
]
datasets = [
  "datasets>=3.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "evidence*", "llm*", "agent*", "datasets*", "eval*", "ui*", "security*", "utils*", "priorix_tasks*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
