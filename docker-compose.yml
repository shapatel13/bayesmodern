version: "3.9"

services:
  api:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: bash -lc "pip install -e .[dev] && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    ports:
      - "8000:8000"

  research_console:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: bash -lc "pip install -e .[dev] && streamlit run apps/research_console/app.py --server.port 8501 --server.address 0.0.0.0"
    env_file:
      - .env
    ports:
      - "8501:8501"

